<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рибалка</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;color:#eef2f6;
    background:radial-gradient(1200px 600px at 50% -10%, #2d4a63 0%, #20344a 45%, #14202e 100%)}
  .wrap{max-width:560px}
  .fish{font-size:72px;margin-bottom:20px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  h1{font-size:24px;font-weight:800;letter-spacing:.3px;margin-bottom:10px}
  p{opacity:.6;font-size:15px;line-height:1.55;margin-bottom:36px}
  a.btn{display:inline-block;text-decoration:none;
    background:linear-gradient(180deg,#3ad07f,#2ba05f);color:#052414;font-weight:800;font-size:19px;
    padding:20px 38px;border-radius:18px;box-shadow:0 12px 34px rgba(43,160,95,.4);
    transition:transform .12s ease, box-shadow .12s ease}
  a.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(43,160,95,.5)}
  a.btn:active{transform:translateY(0)}
  .sub{margin-top:22px;font-size:12px;opacity:.35}
</style>
</head>
<body>
  <div class="wrap">
    <div class="fish">🎣</div>
    <h1>Гру заархівовано</h1>
    <p>Досить віртуальної рибалки — час на справжню воду.</p>
    <a class="btn" href="https://maps.app.goo.gl/DagSXjzxeCPUcpas6?g_st=ic">надалі тільки справжня рибалка</a>
    <div class="sub">Архів гри: game.html</div>
  </div>
</body>
</html>
